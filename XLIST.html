let entries = [];

/**
 * Toggles the visibility of the authentication dropdown menu.
 * Triggered by clicking the #profile-trigger button.
 */
function toggleAuthDropdown(event) {
  event.stopPropagation(); // Prevents the global document click listener from immediately closing it
  const widget = document.querySelector('.profile-widget');
  widget.classList.toggle('active');
}

/**
 * Global click listener that automatically closes the login/signup dropdown 
 * if a user clicks anywhere outside of the widget card boundary.
 */
document.addEventListener('click', function(event) {
  const widget = document.querySelector('.profile-widget');
  if (widget && widget.classList.contains('active')) {
    if (!widget.contains(event.target)) {
      widget.classList.remove('active');
    }
  }
});


// ==========================================================================

/**
 * Handles account registration via Supabase Auth when hitting the 'Sign Up' button.
 */
async function handleSignUp() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value.trim();
  
  if (!email || !password) { 
    alert('Please enter both email and password.'); 
    return; 
  }
  
  // CHANGED: Changed 'supabase' to 'supabaseClient'
  const { error } = await supabaseClient.auth.signUp({ email, password });
  if (error) {
    alert(error.message);
  } else {
    alert('Check your email for the confirmation link!');
  }
}

/**
 * Handles user sign in validations via password match credentials.
 */
async function handleLogin() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value.trim();
  
  if (!email || !password) { 
    alert('Please enter both email and password.'); 
    return; 
  }
  
  // CHANGED: Changed 'supabase' to 'supabaseClient'
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) alert(error.message);
}

/**
 * Terminates the active session and logs out the user.
 */
async function handleLogout() {
  // CHANGED: Changed 'supabase' to 'supabaseClient'
  await supabaseClient.auth.signOut();
  // Automatically close the dropdown frame upon successful exit
  document.querySelector('.profile-widget').classList.remove('active');
}

<script>
// ═══════════════════════
/**
 * Fetches all entries from the Supabase database.
 * Replaces the old localStorage-based loadEntries().
 */
async function loadEntries() {
  try {
    if (!currentUser) return; // Safety check

    const { data, error } = await supabaseClient
      .from('kinta_entries')
      .select('*')
      .eq('user_id', currentUser.id) // 🔒 FIXED: Only fetch logs belonging to this user
      .order('created_at', { ascending: false }); 

    if (error) throw error;

    // If database is empty for this specific user, handle seeding or clear view
    if (!data || data.length === 0) {
      console.log('No entries found for this user.');
      await seedDefaultEntries();
      return;
    }

    entries = data;
    renderTimeline();
  } catch (error) {
    console.error('Error loading entries from Supabase:', error.message);
  }
}

async function seedDefaultEntries() {
  if (typeof DEFAULT_ENTRIES !== 'undefined' && DEFAULT_ENTRIES.length > 0) {
    try {
      // Strip old IDs and attach the current user's ID to the defaults
      const cleanDefaults = DEFAULT_ENTRIES.map(({ id, ...rest }) => ({
        ...rest,
        user_id: currentUser.id
      }));
      
      const { data, error } = await supabaseClient
        .from('kinta_entries')
        .insert(cleanDefaults)
        .select();

      if (error) throw error;
      
      entries = data;
      renderTimeline();
    } catch (e) {
      console.error('Failed to seed default entries:', e.message);
    }
  } else {
    // If no defaults exist, ensure we wipe out the previous account's items from memory
    entries = [];
    renderTimeline();
  }
}


// ═══════════════════════════════════
// MUTATIONS (Replacing saveEntries)
// ═══════════════════════════════════

/**
 * Creates a new entry in the Supabase database
/**
 * Creates a new entry in the Supabase database
 */
async function addEntry(newEntryData) {
  try {
    const { data, error } = await supabaseClient
      .from('kinta_entries')
      .insert([newEntryData])
      .select();

    if (error) throw error;

    // 1. Push the newly created row into local state
    entries.unshift(data[0]); 
    
    // 2. FIXED: Call the correct rendering function
    renderTimeline();
    
  } catch (error) {
    console.error('Error adding entry:', error.message);
    alert('Failed to add entry: ' + error.message);
  }
}

/**
 * Updates an existing entry by its ID
 */
async function updateEntry(id, updatedFields) {
  try {
    const { error } = await supabaseClient
      .from('kinta_entries')
      .update(updatedFields)
      .eq('id', id);

    if (error) throw error;

    // 1. Sync local state using the same bulletproof String() matching
    entries = entries.map(item => 
      String(item.id) === String(id) ? { ...item, ...updatedFields } : item
    );
    
    // 2. FIXED: Call the correct rendering function
    renderTimeline();
    
  } catch (error) {
    console.error('Error updating entry:', error.message);
    alert('Failed to update entry: ' + error.message);
  }
}
/**
 * Deletes an entry from the database
 */
async function deleteEntry(id) {
  // 1. This triggers the browser's confirmation popup!
  const isConfirmed = confirm('Are you sure you want to delete this entry? This cannot be undone.');
  
  // If they click "Cancel", stop the function right here
  if (!isConfirmed) {
    return; 
  }
  
  try {
    // 2. Delete the row from the Supabase database
    const { error } = await supabaseClient
      .from('kinta_entries')
      .delete()
      .eq('id', id);

    if (error) throw error;

    // 3. Remove the item from your local array instantly
    entries = entries.filter(item => String(item.id) !== String(id));

    // 4. Force the timeline to instantly redraw without the deleted item
    renderTimeline();
    
  } catch (error) {
    console.error('Error deleting entry:', error.message);
    alert('Failed to delete entry: ' + error.message);
  }
}
// ═══════════════════════════════════
// RENDER
// ═══════════════════════════════════

function renderTimeline() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const typeFilter = currentFilter;

  let filtered = entries.filter(e => {
    const matchType = typeFilter === 'all' || e.type === typeFilter;
    const matchSearch = !search || 
      e.title.toLowerCase().includes(search) ||
      (e.org||'').toLowerCase().includes(search) ||
      (e.desc||'').toLowerCase().includes(search);
    return matchType && matchSearch;
  });

  // Sort by year descending
  filtered.sort((a, b) => (b.year||0) - (a.year||0));

  // Group by year
  const byYear = {};
  filtered.forEach(e => {
    const yr = e.year || 'Unknown';
    if (!byYear[yr]) byYear[yr] = [];
    byYear[yr].push(e);
  });

  const years = Object.keys(byYear).sort((a,b) => b-a);

  const container = document.getElementById('timeline');

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-title">No entries found</div>
        <div class="empty-sub">Add your first entry or adjust your filters.</div>
      </div>`;
    updateStats();
    return;
  }

  container.innerHTML = years.map(yr => `
    <div class="year-section">
      <div class="year-header">
        <span class="year-label">${yr}</span>
        <div class="year-line"></div>
        <span class="year-count">${byYear[yr].length} entr${byYear[yr].length===1?'y':'ies'}</span>
      </div>
      ${byYear[yr].map(e => renderEntry(e)).join('')}
    </div>
  `).join('');

  updateStats();
}

function renderEntry(e) {
  const appBadge = e.appval === 'high' 
    ? `<span class="app-value app-high">★ High value</span>`
    : e.appval === 'med'
    ? `<span class="app-value app-med">◆ Medium</span>`
    : `<span class="app-value app-low">· Low</span>`;

  const typeLabel = {
    competition: 'Competition', project: 'Project', award: 'Award',
    leadership: 'Leadership', academic: 'Academic', community: 'Community', personal: 'Personal'
  }[e.type] || e.type;

  return `
    <div class="entry" id="entry-${e.id}" onclick="toggleEntry('${e.id}')">
      <div class="entry-header">
        <span class="entry-dot dot-${e.type}"></span>
        <div class="entry-main">
          <div class="entry-title">${escHtml(e.title)}</div>
          ${e.org ? `<div class="entry-org">${escHtml(e.org)}</div>` : ''}
        </div>
      </div>
      <div class="entry-meta">
        <span class="entry-date">${escHtml(e.date||'')}</span>
        <span class="entry-tag type-${e.type}">${typeLabel}</span>
        ${appBadge}
      </div>
      <div class="entry-body">
${e.desc_text ? `<p style="margin-bottom:8px;">${escHtml(e.desc_text)}</p>` : ''}
        ${e.frame ? `
          <div style="margin-bottom:10px;padding:8px 10px;background:var(--surface2);border-radius:5px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text-sec);line-height:1.6;">
            <div style="font-size:9px;color:var(--text-ter);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;">Application framing</div>
            ${escHtml(e.frame)}
          </div>` : ''}
        ${e.reflect ? `
          <div class="entry-reflection">
            <div class="entry-reflection-label">Personal reflection</div>
            ${escHtml(e.reflect)}
          </div>` : ''}
        <div class="entry-actions" onclick="event.stopPropagation()">
          <button class="btn-edit" onclick="editEntry('${e.id}')">Edit</button>
          <button class="btn-delete" onclick="deleteEntry('${e.id}')">Delete</button>
        </div>
      </div>
    </div>`;
}

function toggleEntry(id) {
  const el = document.getElementById('entry-' + id);
  if (el) el.classList.toggle('expanded');
}

function updateStats() {
  document.getElementById('stat-total').textContent = entries.length;
  document.getElementById('stat-high').textContent = entries.filter(e => e.appval === 'high').length;
  document.getElementById('stat-reflect').textContent = entries.filter(e => e.reflect && e.reflect.trim()).length;
  const years = [...new Set(entries.map(e => e.year).filter(Boolean))];
  document.getElementById('stat-years').textContent = years.length;
}

// ═══════════════════════════════════
// MODAL
// ═══════════════════════════════════

function openModal(prefill) {
  editingId = null;
  document.getElementById('modal-title').textContent = 'New Entry';
  document.getElementById('edit-id').value = '';
  ['title','org','date','year','desc','frame','reflect'].forEach(f => {
    document.getElementById('f-'+f).value = prefill?.[f] || '';
  });
  document.getElementById('f-type').value = prefill?.type || 'competition';
  document.getElementById('f-appval').value = prefill?.appval || 'med';
  document.getElementById('modal').classList.add('open');
}

function editEntry(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit Entry';
  document.getElementById('edit-id').value = id;
  document.getElementById('f-title').value = e.title || '';
  document.getElementById('f-org').value = e.org || '';
  document.getElementById('f-type').value = e.type || 'competition';
  document.getElementById('f-appval').value = e.appval || 'med';
  document.getElementById('f-date').value = e.date || '';
  document.getElementById('f-year').value = e.year || '';
  document.getElementById('f-desc').value = e.desc_text || '';
  document.getElementById('f-frame').value = e.frame || '';
  document.getElementById('f-reflect').value = e.reflect || '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}
function saveEntry() {
  // 1. Grab the title input safely
  const titleInputElement = document.getElementById('f-title');
  if (!titleInputElement) {
    alert("Error: Missing input element with ID 'f-title'");
    return;
  }
  
  // 2. Define the 'title' variable clearly
  const title = titleInputElement.value.trim();

  // 3. Simple validations
  if (!title) { 
    alert('Please add a title.'); 
    return; 
  }

  if (!currentUser) {
    alert('You must be signed in to save entries!');
    return;
  }

  // 4. Build the data payload (All variables are mapped cleanly with commas)
  const data = {
    title: title,
    org: document.getElementById('f-org').value.trim(),
    type: document.getElementById('f-type').value,
    appval: document.getElementById('f-appval').value,
    date: document.getElementById('f-date').value.trim(),
    year: parseInt(document.getElementById('f-year').value) || null,
    frame: document.getElementById('f-frame').value.trim(),
    reflect: document.getElementById('f-reflect').value.trim(),
    user_id: currentUser.id,
    desc_text: document.getElementById('f-desc').value.trim()
  };

  // 5. Send to Supabase mutations
  if (editingId) {
    updateEntry(editingId, data);
  } else {
    addEntry(data);
  }
  
  closeModal();
}


// ═══════════════════════════════════
// FILTERS & VIEWS
// ═══════════════════════════════════

function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderTimeline();
}

function setView(type) {
  currentView = type;
  currentFilter = type === 'all' ? 'all' : type;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  // Sync filter bar
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', 
      b.textContent.trim().toLowerCase() === (type === 'all' ? 'all' : type));
  });
  renderTimeline();
}

// ═══════════════════════════════════
// UTILS
// ═══════════════════════════════════

function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});



// ==========================================================================
// 2. SUPABASE AUTHENTICATION ENGINE & STATE LISTENER
// ==========================================================================

/**
 * Listens for change events in user login state (Sign In, Sign Up, Sign Out).
 * Dynamically switches views inside the dropdown and updates layout elements.
 */
supabaseClient.auth.onAuthStateChange((event, session) => {
  const loggedOutView = document.getElementById('logged-out-view');
  // SAFE FALLBACK: Checks for both lowercase and camelCase IDs in your HTML
  const loggedInView = document.getElementById('logged-in-view') || document.getElementById('loggedIn-view'); 
  const sidebarUsername = document.getElementById('sidebar-username');
  const sidebarLogoName = document.getElementById('sidebar-logo-name');
  const emailText = document.getElementById('user-email-text');
  const topUsername = document.getElementById('top-username');

  // ... rest of your if/else code stays exactly the same!

  if (session) {
    currentUser = session.user;
    
    // 1. Extract a clean username from the email (capitalizes everything before the '@')
    let name = "User";
    if (currentUser.user_metadata && currentUser.user_metadata.full_name) {
      name = currentUser.user_metadata.full_name;
    } else if (currentUser.email) {
      let rawName = currentUser.email.split('@')[0];
      name = rawName.charAt(0).toUpperCase() + rawName.slice(1);
    }

    // 2. Inject user identities into the layout text placeholders
    sidebarUsername.textContent = name;
    if (topUsername) topUsername.textContent = name;
    if (sidebarLogoName) sidebarLogoName.innerHTML = name;
    emailText.textContent = currentUser.email;

    // 3. Swap form panels inside the dropdown to display the logged-in user profile
    loggedOutView.style.display = 'none';
    loggedInView.style.display = 'block';

    // 4. Fetch personal records matching this user from your cloud database
    loadEntries();
  } else {
    currentUser = null;
    
    // Reset layout UI components back to default values
    sidebarUsername.textContent = "Sign In";
    if (topUsername) topUsername.textContent = "User";
    if (sidebarLogoName) sidebarLogoName.innerHTML = "Kinta<br>Experience Log";

    // Revert form panels back to the login inputs view
    loggedOutView.style.display = 'block';
    loggedInView.style.display = 'none';
    
    // Wipe local entries variable and clear out the visible timeline content
    entries = [];
    renderTimeline();
  }
});

loadEntries();
renderTimeline();
